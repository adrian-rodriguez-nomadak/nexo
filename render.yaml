databases:
  - name: nexo-db
    plan: free
    databaseName: nexo
    user: nexo

services:
  - type: web
    name: nexo-api
    runtime: node
    plan: free
    rootDir: backend/api
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexo-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: CORS_ORIGIN
        sync: false
      - key: AUTH_EXCHANGE_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_ASSISTANT_MODEL
        value: gpt-5.6-sol
      - key: OPENAI_VISION_MODEL
        value: gpt-5.6-sol
      - key: NEXO_TEXT_PROVIDER
        value: groq
      - key: NEXO_TEXT_API_URL
        value: https://api.groq.com/openai/v1
      - key: NEXO_TEXT_API_KEY
        sync: false
      - key: NEXO_TEXT_MODEL
        value: llama-3.1-8b-instant
